version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocksage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./app/models:/app/app/models

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./app/models:/app/app/models

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
